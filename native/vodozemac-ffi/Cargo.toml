[package]
name = "vodozemac-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "C interface to vodozemac (Olm and Megolm) for Matrix.Client.Crypto"
license = "Apache-2.0"
publish = false

[lib]
name = "vodozemac_ffi"
crate-type = ["cdylib"]

[dependencies]
vodozemac = { version = "=0.11.1", features = ["insecure-pk-encryption"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
