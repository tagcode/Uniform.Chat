# Release: on a version tag such as v0.1.0 or v0.2.0-alpha.1, build and test, pack the libraries,
# build the apps (desktop, terminal client, server, STUN and TURN server) with their user guides for Windows and Linux, as Debian packages, and the signed Android APK,
# push the packages to NuGet.org with trusted publishing, create a GitHub release with the app archives and the APK,
# and, for a release but not a prerelease, make the release an apt repository, publish the documentation on https://tagcode.github.io/Uniform.Chat/ and add the APK to the F-Droid repository on https://tagcode.github.io/fdroid/repo.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: 10.0.x

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # v1.2.3 or v1.2.3-suffix; the suffix makes a prerelease on NuGet and GitHub
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-suffix]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  test:
    name: Build and test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # The solution has the Android app, which needs its workload; the runner has the Android SDK and Java
      - run: dotnet workload install android
      # Live tests skip without testclient.txt; native vodozemac tests skip without the native library
      - run: dotnet build Uniform.Chat.slnx -c Release
      - run: dotnet test --solution Uniform.Chat.slnx -c Release --no-build

  packages:
    name: Pack libraries
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Packing builds the whole solution, the Android app too
      - run: dotnet workload install android
      - run: dotnet pack Uniform.Chat.slnx -c Release -o artifacts -p:Version=${{ needs.version.outputs.version }} -p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v5
        with:
          name: nuget
          path: artifacts/*.*nupkg
          if-no-files-found: error
          # Only passed between jobs; the release and NuGet keep the published files
          retention-days: 1

  docs:
    name: User guides
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # HTML for reading offline, one guide per app; the statictoc theme needs no web server
      - run: dotnet tool restore
      # Warnings fail the build, so broken links and missing uids are found here
      - name: Build guides
        run: |
          for guide in desktop:Uniform.Chat.Desktop terminal:Uniform.Chat.Terminal server:Uniform.Chat.Server stun:Uniform.Stun.Server; do
            IFS=: read -r kind folder <<< "$guide"
            dotnet docfx "user-docs/$folder/docfx.json" --warningsAsErrors
            mkdir -p guides && cp -r "user-docs/$folder/_site" "guides/$kind"
          done
          dotnet docfx user-docs/Uniform.Chat.Android/docfx.json --warningsAsErrors
      # The developer site with the API reference, checked the same way; not part of the release archives
      - name: Check developer site
        run: dotnet docfx docs/docfx.json --warningsAsErrors
      - uses: actions/upload-artifact@v5
        with:
          name: guides
          path: guides
          if-no-files-found: error
          retention-days: 1
      # All the sites as GitHub Pages serves them: the developer site in docs/, each user guide in user-docs/<its folder>/
      - name: Collect sites
        run: |
          mkdir -p sites/user-docs
          cp -r docs/_site sites/docs
          for folder in Uniform.Chat.Desktop Uniform.Chat.Terminal Uniform.Chat.Server Uniform.Stun.Server Uniform.Chat.Android; do
            cp -r "user-docs/$folder/_site" "sites/user-docs/$folder"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: sites
          path: sites
          if-no-files-found: error
          retention-days: 1

  apps:
    name: Apps (${{ matrix.rid }})
    needs: [version, test, docs]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: guides
          path: guides
      # Self-contained single-file apps, no ahead-of-time compilation; .tar.gz for Linux, .zip for Windows.
      # desktop is the Avalonia app; its Linux archive has install-desktop-entry.sh for the application menu. stun is uniform-stun-server.
      # Each archive has its own user guide as HTML in docs/, built from its project's folder in user-docs/.
      - name: Publish and archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          mkdir -p release
          for app in desktop:Uniform.Chat.Desktop terminal:Uniform.Chat.Terminal server:Uniform.Chat.Server stun:Uniform.Stun.Server; do
            IFS=: read -r kind project <<< "$app"
            name="uniform-chat-$kind-$VERSION-$RID"
            dotnet publish "src/$project" -c Release -r "$RID" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
              -p:DebugType=embedded -p:IsTransformWebConfigDisabled=true -p:ContinuousIntegrationBuild=true \
              -p:Version="$VERSION" -o "publish/$name"
            # Our symbols are embedded; native libraries bring large .pdb files of their own
            rm -f "publish/$name"/*.pdb
            cp -r LICENSE LICENSES THIRD-PARTY-NOTICES.md "publish/$name/"
            cp -r "guides/$kind" "publish/$name/docs"
            if [[ "$RID" == win-* ]]; then
              (cd publish && zip -qr "../release/$name.zip" "$name")
            else
              tar -czf "release/$name.tar.gz" -C publish "$name"
              # The same app as a Debian package, e.g. uniform-chat-server_0.2.0_amd64.deb, for the apt repository of the release
              packaging/linux/build-deb.sh "$kind" "publish/$name" "$VERSION" "$RID" release
            fi
          done
      - uses: actions/upload-artifact@v5
        with:
          name: apps-${{ matrix.rid }}
          path: release/*
          if-no-files-found: error
          # Only passed between jobs; the release and NuGet keep the published files
          retention-days: 1

  android:
    name: Android APK
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet workload install android
      # Signed with the release key from the repository's secrets; the keystore is written outside the checkout and deleted after.
      # The version code follows the version, e.g. 0.2.1 is 201; see the project file. Without the secrets the release has no APK.
      - name: Build signed APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; the release has no Android APK"
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$keystore"
          trap 'rm -f "$keystore"' EXIT
          dotnet publish src/Uniform.Chat.Android -c Release -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true \
            -p:AndroidSigningKeyStore="$keystore" -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" -o publish/android
          mkdir -p release
          cp publish/android/rip.uniform.chat-Signed.apk "release/uniform-chat-android-$VERSION.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: apps-android
          path: release/*
          if-no-files-found: ignore
          retention-days: 1

  nuget:
    name: Publish to NuGet.org
    needs: [version, packages, apps]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing: GitHub's OIDC token is exchanged for a short-lived NuGet API key
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: artifacts
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      # Symbol packages (.snupkg) next to the packages are pushed with them
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    name: GitHub release
    needs: [version, nuget, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: apps-*
          path: release
          merge-multiple: true
      # A release, but not a prerelease, is the apt repository at https://github.com/<repository>/releases/ latest/download/:
      # its index lists this release's packages and those of the earlier releases, each in its own release; signed with the APT key
      - name: Apt repository
        if: needs.version.outputs.prerelease == 'false'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          if [[ -z "$APT_GPG_PRIVATE_KEY" ]]; then
            echo "::warning::No APT_GPG_PRIVATE_KEY secret; the release has packages but no apt repository index"
            exit 0
          fi
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y apt-utils
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --import <<< "$APT_GPG_PRIVATE_KEY"
          # Until this release is created, latest is the previous release
          packaging/linux/build-apt-index.sh release "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Packages" release
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Uniform Chat $VERSION" --generate-notes "${flags[@]}"

  pages:
    name: GitHub Pages
    # Releases only: the documentation follows the released version, and prereleases share the version code of their release,
    # e.g. 0.2.1-rc1 and 0.2.1 are both 201, so only releases go to F-Droid
    needs: [version, release, docs]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      # Without the token for the Pages repository nothing is published; without the repository key, only the documentation
      - id: check
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [[ -z "$PAGES_TOKEN" ]]; then
            echo "::warning::No PAGES_TOKEN secret; GitHub Pages is not updated"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          if [[ -z "$FDROID_KEYSTORE_BASE64" ]]; then
            echo "::warning::No FDROID_KEYSTORE_BASE64 secret; the F-Droid repository is not updated"
            echo "fdroid=false" >> "$GITHUB_OUTPUT"
          else
            echo "fdroid=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          path: source
      # The site at https://tagcode.github.io
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          repository: tagcode/tagcode.github.io
          token: ${{ secrets.PAGES_TOKEN }}
          path: pages
      - if: steps.check.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: sites
          path: sites
      # The documentation replaces the previous release's: https://tagcode.github.io/Uniform.Chat/docs/ and /Uniform.Chat/user-docs/<guide>/
      - name: Update documentation
        if: steps.check.outputs.ok == 'true'
        run: |
          rm -rf pages/Uniform.Chat/docs pages/Uniform.Chat/user-docs
          mkdir -p pages/Uniform.Chat
          cp -r sites/docs sites/user-docs pages/Uniform.Chat/
      - if: steps.check.outputs.fdroid == 'true'
        uses: actions/download-artifact@v4
        with:
          name: apps-android
          path: apk
      - if: steps.check.outputs.fdroid == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # fdroidserver reads the APKs, signs the index with the repository key and makes the web page; apksigner comes from the runner's Android SDK
      - if: steps.check.outputs.fdroid == 'true'
        run: pip install fdroidserver==2.4.5
      # https://tagcode.github.io/fdroid/repo keeps only the newest version; the keystore is written outside the checkouts and deleted after; the passwords stay in the environment
      - name: Update F-Droid repository
        if: steps.check.outputs.fdroid == 'true'
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        run: |
          work="$RUNNER_TEMP/fdroid"
          mkdir -p "$work/repo"
          trap 'rm -f "$work/keystore.p12"' EXIT
          base64 -d <<< "$FDROID_KEYSTORE_BASE64" > "$work/keystore.p12"
          cat > "$work/config.yml" <<EOF
          repo_url: https://tagcode.github.io/fdroid/repo
          repo_name: Uniform Chat
          repo_description: Releases of Uniform Chat, built and signed by its developer. https://github.com/tagcode/Uniform.Chat
          repo_icon: icon.png
          archive_older: 0
          keystore: keystore.p12
          repo_keyalias: $FDROID_KEY_ALIAS
          keystorepass: {env: FDROID_KEYSTORE_PASSWORD}
          keypass: {env: FDROID_KEYSTORE_PASSWORD}
          EOF
          chmod 600 "$work/config.yml"
          cp -r source/fdroid/metadata "$work/metadata"
          cp -r source/fastlane/metadata/android "$work/metadata/rip.uniform.chat"
          cp source/fastlane/metadata/android/en-US/images/icon.png "$work/icon.png"
          # Only the new version; the earlier ones on the site are dropped, to keep the site small
          cp apk/*.apk "$work/repo/"
          (cd "$work" && fdroid update)
          # The run's status tells of the build machine, not of the repository
          rm -rf "$work/repo/status"
          rm -rf pages/fdroid/repo
          mkdir -p pages/fdroid
          cp -r "$work/repo" pages/fdroid/repo
      # One commit replaces the site's history, so dropped APKs and old documentation don't pile up in it; the site's other files stay as they are
      - name: Publish
        if: steps.check.outputs.ok == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd pages
          branch="$(git branch --show-current)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan published
          git add -A
          git commit -q -m "Uniform Chat $VERSION: documentation and F-Droid repository"
          git push --force origin "published:$branch"
